# mkdocs-material documentation site config.
#
# LIVE at https://smartcli.readthedocs.io/ — Read the Docs builds it via
# .readthedocs.yaml, whose pre_build step runs tools/build_docs.py to assemble
# the docs/*.md stubs. The showcase site (docs/site/, deployed by pages.yml to
# GitHub Pages) is a SEPARATE site — do NOT run `mkdocs gh-deploy`, it would
# overwrite the showcase on the gh-pages branch.
#
# Local preview:
#   pip install mkdocs-material && python tools/build_docs.py && mkdocs serve
site_name: SmartCLI
site_description: Three terminal Agent Skills over one pluggable PTY + pyte core.
site_url: https://smartcli.readthedocs.io/
repo_url: https://github.com/dwgx/SmartCLI
repo_name: dwgx/SmartCLI
# Empty on purpose: the docs/*.md pages are generated, so an "edit this page"
# link would point at a path that does not exist in the repo.
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# docs/ also holds the showcase site (docs/site/), the localized READMEs
# (docs/i18n/, GitHub-flavored with anchors mkdocs can't resolve), and
# hand-written packaging/launch notes. None of those are pages of THIS
# reference site — only the generated stubs in the nav are. Exclude the rest so
# mkdocs doesn't try to render them (and so a build isn't buried in warnings
# about GitHub-relative links that are correct on GitHub).
exclude_docs: |
  site/
  i18n/
  requirements.txt
  PACKAGING-NOTES.md
  MACOS-VERIFY.md
  LAUNCH-COPY.md

# The nav maps existing repo docs into a site. mkdocs reads Markdown from docs_dir
# (default: docs/), so these use paths relative to the repo via the include below.
# Simplest path: keep authoring in the repo root/README and let RTD render them.
nav:
  - Home: index.md
  - Install: install.md
  - Usage: usage.md
  - Skills:
      - cmd-art: skills-cmd-art.md
      - drive-tui: skills-drive-tui.md
      - tui-ui: skills-tui-ui.md
  - Knowledge graph: knowledge.md
  - Changelog: changelog.md

# NOTE: the docs/*.md pages in the nav above are GENERATED (and gitignored) by
# tools/build_docs.py from README.md, INSTALL.md, README-USAGE.md, the SKILL.md
# files, knowledge/INDEX.md and CHANGELOG.md. If you change the nav, update that
# script's MAPPING to match — its own header says the same.
