# Read the Docs build config for the mkdocs-material site.
#
# The site is LIVE at https://smartcli.readthedocs.io/ — RTD builds from this
# file plus mkdocs.yml, running tools/build_docs.py in pre_build to assemble the
# docs/*.md pages. The showcase site (docs/site/, deployed by pages.yml to
# GitHub Pages) is separate and unaffected; this is the reference-docs site.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Assemble docs/*.md from the canonical sources (README, SKILL.md files,
    # CHANGELOG, knowledge/INDEX) before mkdocs runs, so the site never drifts.
    pre_build:
      - python tools/build_docs.py

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
