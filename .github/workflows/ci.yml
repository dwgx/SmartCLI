name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Deterministic checks across all three OSes and the supported Python edges.
  # Windows matches the primary dev/target environment (ConPTY via pywinpty);
  # Linux + macOS
  # exercise the stdlib POSIX pty backend that was previously only hand-verified
  # over SSH. The interactive drive-tui PTY probes and the effort_selector path
  # need a live TTY and stay out of this broad matrix. The bounded native
  # drive-smoke job below covers the persistent PTY/MCP path separately.
  tests:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: fx regression (verify_fx)
        run: python tests/verify_fx.py

      # Crown-jewel DETERMINISTIC gates — pure/in-memory, no PTY spawn, so they
      # run reliably on every OS and now gate every PR (previously these
      # mutation-proof / contract / fuzz suites weren't wired into CI at all).
      - name: fx frame contract (30 effects x sizes)
        run: python tests/test_fx_contract.py

      - name: readiness virtual-clock + blank-gate locks
        run: python tests/test_readiness.py

      - name: wait_any multi-marker wait (deterministic)
        run: python tests/test_wait_any.py

      - name: visual-change selection/cursor locks (deterministic)
        run: python tests/test_visual_change.py

      - name: drive control-plane security boundaries (deterministic)
        run: python tests/test_drive_security.py

      - name: ten version sites agree (anti-drift)
        run: python tests/test_version_sync.py

      - name: dependency declarations agree (anti-drift)
        run: python tests/test_dependency_sync.py

      - name: real-terminal fidelity locks (deterministic)
        run: python tests/test_terminal_fidelity.py

      - name: wait-primitive performance contract (deterministic)
        run: python tests/test_perf_contract.py

      - name: readiness property-based invariants (skips without hypothesis)
        run: |
          python -m pip install --quiet hypothesis
          python tests/test_readiness_properties.py

      - name: sixel wire-format lock (deterministic)
        run: python tests/test_sixel.py

      - name: terminal-bench adapter driver+loop (deterministic)
        run: python tests/test_tbench_adapter.py

      - name: harbor agent adapter (deterministic, no Docker)
        run: python tests/test_harbor_agent.py

      - name: degenerate-input regression locks
        run: python tests/test_degenerate_inputs.py

      - name: pure-memory fuzz sandbox (perception chain)
        run: python tests/_sandbox_fuzz_core.py

      - name: drive-tui vendored core == canonical
        run: python tests/test_vendor_sync.py

      - name: doc counts match code (anti-drift, fx=30 guard)
        run: python tests/test_doc_counts.py

      - name: README literal import-order check
        run: python tests/_readme_literal.py

      - name: tui-ui self test
        working-directory: skills/tui-ui
        run: python self_test.py

      - name: cmd-art effect catalog renders
        working-directory: skills/cmd-art
        run: python -m fx list

      - name: tui-ui widget catalog renders
        working-directory: skills/tui-ui
        run: python -m ui widgets

      # POSIX-only: the stdlib pty.fork() backend + perceive stack + the two
      # recorded POSIX fixes (#5 SS3 arrows, #6 zombie reap). This is the code
      # path that was previously only hand-verified on Debian over SSH; running
      # it on ubuntu + macos keeps it green automatically and finally covers the
      # macOS BSD-pty EOF path.
      - name: POSIX pty backend sandbox
        if: runner.os != 'Windows'
        run: python tests/_sandbox_posix_backend.py

  # Real end-to-end sessions on native ConPTY/BSD PTY/Linux PTY. Each probe
  # owns at most one live child at a time and closes it in a finally block; the
  # steps remain serial within each isolated runner.
  drive-smoke:
    name: drive + MCP smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Persistent CLI end-to-end
        run: python tests/_tui_cli_probe.py
      - name: MCP adapter end-to-end
        run: python tests/_mcp_probe.py
      - name: Malformed transport remains session-local
        run: python tests/_sandbox_daemon_robustness.py

  # The release artifact is a product surface of its own. Build it, inspect its
  # contents, install into a clean environment, and exercise the installed
  # console command so a source-only success cannot hide a broken wheel.
  package:
    name: wheel + registry contract
    runs-on: ubuntu-latest
    # This job runs a real-PTY probe (SMARTCLI_TEST_INSTALLED=1 _mcp_probe) —
    # bound it like drive-smoke so a hung probe cannot eat the 360-min default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build tooling
        run: python -m pip install --upgrade pip build twine check-jsonschema uv
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          check-jsonschema --schemafile "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json" server.json
      - name: Verify release metadata and wheel contents
        run: |
          python - <<'PY'
          import json
          import tomllib
          import zipfile
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          plugin = json.loads(Path(".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          version = project["version"]
          assert server["version"] == version
          assert server["packages"][0]["version"] == version
          assert plugin["version"] == version

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "smartcli_core/__init__.py",
              "smartcli_drive/__init__.py",
              "smartcli_drive/tui.py",
              "smartcli_drive/mcp_server.py",
              "smartcli_drive/smartcli_bootstrap.py",
          }
          missing = required - names
          assert not missing, f"wheel is missing: {sorted(missing)}"
          print(f"validated {wheel.name} ({version})")
          PY
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          wheel_venv="$(mktemp -d)/venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install dist/*.whl
          "$wheel_venv/bin/python" -m pip check
          "$wheel_venv/bin/smartcli-tui" doctor
          "$wheel_venv/bin/smartcli-tui" --help
          "$wheel_venv/bin/python" -c "import smartcli_core, smartcli_drive.mcp_server"
          SMARTCLI_TEST_INSTALLED=1 "$wheel_venv/bin/python" tests/_mcp_probe.py
          uvx --from dist/*.whl smartcli-tui doctor

  # Coverage over the DETERMINISTIC subset (no PTY/fuzz — those don't compose
  # with coverage's process-startup hook; see tools/coverage_run.py). One OS is
  # enough — coverage of pure-logic gates is OS-independent. Advisory: it reports
  # a number and uploads to Codecov, it does not gate the build.
  coverage:
    name: coverage (deterministic subset)
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Install the optional extras too: the banner widget's golden frame is
          # the pyfiglet render, so pyfiglet must be present or that gate skips.
          # It also makes coverage exercise the optional-dep code paths.
          python -m pip install ".[all]"
          python -m pip install "coverage[toml]>=7.0"
      - name: Run coverage over the deterministic gates
        run: python tools/coverage_run.py --xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          # Tokenless uploads on a plain push are rate-limited/unsupported now
          # (v4/v5 only allow it for fork PRs), so use the repo upload token.
          # Add it once: Codecov -> the repo -> copy CODECOV_TOKEN, then GitHub
          # repo Settings -> Secrets and variables -> Actions -> new secret
          # named CODECOV_TOKEN. Until it exists this step soft-fails (advisory).
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

  # The DETERMINISTIC gates from build_suite() that this job runs, plus the
  # ones no workflow names but still runs. Re-derived 2026-10-01: **24**, and
  # the number has two routes, not one. Counting only the `python -B tests/...`
  # lines below gives 20; grepping the workflows alone gives the same 20 and
  # still misses the route-2 four — which is why an earlier version of this
  # comment said "13" and a later one "18". A gate is gated if ANY workflow
  # runs it:
  #
  #   route 1 — named in the steps below (20): the daemon head-of-line/
  #     concurrency lock SECURITY.md cites, the S6/A05/A06 liveness tail, the
  #     seven A04 transport-budget/close/backlog gates, the cell-span /
  #     streaming-SGR / partial-write regressions, the two prose-only claims
  #     in test_enforced_claims (the 4 MiB pre-auth request bound and the
  #     mcp-name <-> server.json <-> runtime serverInfo invariant), and the six
  #     that shipped registered-but-unwired (unknown sequences, the closed
  #     mode registry, revision-baseline waits, child-death-as-an-outcome,
  #     graphics payloads never drawn, the JSON Lines session log). That last
  #     six is the case this job exists for: adding a gate to build_suite()
  #     gates nothing, because no workflow runs that aggregator.
  #   route 2 — named by NO workflow, but run anyway (4): test_golden_frames,
  #     test_cpr_reply, test_char_width, test_wait_change. They are in
  #     tools/coverage_run.py's own DETERMINISTIC_TESTS list, which the
  #     `coverage` job invokes; coverage_run returns a non-zero suite_rc for
  #     any of them that fails (tools/coverage_run.py:124-128, :152-155), and
  #     the coverage step has no `continue-on-error`, so a red one fails the
  #     build. INDIRECT is still gated — but it is gated on ubuntu-latest only,
  #     and it disappears if that job's step is ever marked advisory.
  #
  # Re-derive. Run this verbatim from the repo root; it is the command that
  # produced every number below, and it is the ONLY way these numbers should be
  # obtained — re-counting by hand is how they went stale. Requires PyYAML
  # (in requirements.txt via the docs/lint extras); no PTY is spawned, it is
  # all AST and YAML parsing:
  #
  #   python - <<'PY'
  #   import ast, importlib.util, sys, yaml
  #   from pathlib import Path
  #   ROOT = Path.cwd(); sys.path.insert(0, str(ROOT / "tests"))
  #   spec = importlib.util.spec_from_file_location("ra", ROOT/"tests"/"run_all.py")
  #   ra = importlib.util.module_from_spec(spec); spec.loader.exec_module(ra)
  #
  #   # 1. every tests/*.py target build_suite() names
  #   tg = set()
  #   for t in ra.build_suite():
  #       if "-m" in t.argv: continue
  #       for x in t.argv:
  #           if x.endswith(".py"):
  #               p = Path(x) if Path(x).is_absolute() else Path(t.cwd)/x
  #               p = p.resolve()
  #               if p.parent == (ROOT/"tests").resolve(): tg.add(p.relative_to(ROOT).as_posix())
  #               break
  #   tg = sorted(tg)
  #
  #   # 2. AST spawn scan
  #   BAD = {"subprocess","pty","multiprocessing","winpty","pexpect"}
  #   CALL = {("os",x) for x in ("fork","forkpty","posix_spawn","posix_spawnp","spawnl","spawnv","spawnve","execv","execve")} \
  #        | {("subprocess",x) for x in ("run","Popen","call","check_call","check_output")}
  #   def spawns(p):
  #       r = set()
  #       for n in ast.walk(ast.parse(p.read_text(encoding="utf-8", errors="replace"))):
  #           if isinstance(n, ast.Import):
  #               for a in n.names:
  #                   if a.name.split(".")[0] in BAD: r.add(a.name)
  #           elif isinstance(n, ast.ImportFrom) and n.module and n.module.split(".")[0] in BAD: r.add(n.module)
  #           elif isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and isinstance(n.func.value, ast.Name) \
  #                   and (n.func.value.id, n.func.attr) in CALL: r.add(n.func.attr)
  #       return r
  #   clean = [p for p in tg if not spawns(ROOT/p)]
  #   real  = [p for p in tg if spawns(ROOT/p)]
  #
  #   # 3. PARSED `run:` strings -- a grep cannot tell a comment from a step
  #   runs = []
  #   for wf in sorted((ROOT/".github"/"workflows").glob("*.yml")):
  #       for job, jb in (yaml.safe_load(wf.read_text(encoding="utf-8")).get("jobs") or {}).items():
  #           for st in (jb.get("steps") or []):
  #               if "run" in st: runs.append((job, st["run"]))
  #   def jobs(p): return sorted({j for j, r in runs if p in r})
  #   named = [p for p in clean if jobs(p)]
  #   here  = [p for p in named if "deterministic-rest" in jobs(p)]
  #
  #   # 4. route 2 -- DETERMINISTIC_TESTS, read by AST
  #   det = set()
  #   for n in ast.parse((ROOT/"tools"/"coverage_run.py").read_text(encoding="utf-8")).body:
  #       if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "DETERMINISTIC_TESTS":
  #           det = {ast.literal_eval(e) for e in n.value.elts}
  #   r2      = [p for p in clean if p not in named and Path(p).name in det]
  #   neither = [p for p in clean if p not in named and Path(p).name not in det]
  #
  #   print(f"1  build_suite tests/*.py targets : {len(tg)}")
  #   print(f"2  AST-clean / real-process       : {len(clean)} / {len(real)}")
  #   print(f"3  AST-clean named somewhere in CI: {len(named)}  (this job {len(here)}, tests job {sum(1 for p in named if 'tests' in jobs(p))})")
  #   print(f"4  route-2 (DETERMINISTIC_TESTS)  : {len(r2)}  {[Path(p).stem for p in r2]}")
  #   print(f"5  {len(here)} (here) + {len(r2)} (route 2) = {len(here)+len(r2)}")
  #   print(f"-  AST-clean on NEITHER route     : {len(neither)}  {[Path(p).name for p in neither]}")
  #   print(f"   real-process                   : {[Path(p).name for p in real]}")
  #   PY
  #   PY
  #
  # Its output, 2026-10-01:
  #
  #   1  build_suite tests/*.py targets : 57
  #   2  AST-clean / real-process       : 49 / 8
  #   3  AST-clean named somewhere in CI: 38  (this job 20, tests job 18)
  #   4  route-2 (DETERMINISTIC_TESTS)  : 4  [test_char_width, test_cpr_reply,
  #                                            test_golden_frames, test_wait_change]
  #   5  20 (here) + 4 (route 2) = 24
  #   -  AST-clean on NEITHER route     : 7  [_drive_probe1..6, probe_pty_fx]
  #      real-process                   : 8  [_diff_fuzz_tmux, _diff_tmux_pyte,
  #                                            _diff_two_refs, _mcp_probe,
  #                                            _sandbox_daemon_robustness,
  #                                            _tmux_launcher_probe,
  #                                            _tui_cli_probe, verify_fx]
  #
  # Step by step, so each number can be checked against the step that makes it:
  #   1. Import build_suite() and keep the `TESTS / "*.py"` targets (the
  #      `TESTS / f"_drive_probe{i}"` loop included; `-m ui.*` module runs and
  #      the tui-ui/examples targets are not tests/ files) -> **57 files**.
  #   2. AST-scan each for spawn/fork/forkpty/Popen/subprocess.run (imports of
  #      subprocess/pty/multiprocessing/winpty/pexpect plus the os.* and
  #      subprocess.* call forms) -> **49 AST-clean, 8 real-process**. Only the
  #      49 are candidates for this job; the 8 are the PTY/tmux/differential
  #      probes the `tests` and `drive-smoke` jobs run.
  #   3. Of those 49, parse every .github/workflows/*.yml with yaml.safe_load
  #      and regex the PARSED `run:` strings for `tests/<file>.py` — parsing,
  #      not grepping, because ci.yml discusses test names inside comments and
  #      a grep cannot tell a comment from a step -> **38 named somewhere in
  #      CI**; **20** of them in this job, the other **18** in the `tests` job.
  #   4. Intersect the remaining with DETERMINISTIC_TESTS in
  #      tools/coverage_run.py (read by AST, not by grep) -> the route-2 four.
  #   5. 20 (here) + 4 (route 2) = **24**.
  # Grepping the workflows alone undercounts by the route-2 four.
  #
  # CORRECTION (2026-10-01). This recipe previously claimed 52 targets, 44
  # AST-clean, 32 named, and 12 in the `tests` job. None reproduced: the real
  # values are 57 / 49 / 38 / 18, above. It landed on 24 anyway only because
  # two of its errors cancelled (52-8=44 should have been 57-8=49, and the
  # "12 in the tests job" understated what step 3 actually finds), which is the
  # worst kind of right: a recipe that cannot be followed still produces the
  # published number. A recipe whose stated purpose is "reproduce it rather than
  # re-counting by hand" has to survive being run.
  #
  # A green board that skips these is a board claiming coverage it does not
  # have — the single strongest security claim in SECURITY.md had no gate at
  # all. Of the 49 AST-clean files, **SEVEN** sit on neither route, not the TWO
  # this comment used to name: `_drive_probe1` through `_drive_probe6` and
  # `probe_pty_fx`. All seven construct a real `PtySession` — so a real spawn,
  # just not an AST-visible one, because the spawn happens inside
  # `smartcli_core` rather than in the test file — and they belong with the
  # probes, not here. Recording the real number so the next re-derivation does
  # not read "24" as "every AST-clean build_suite gate is covered": 24 + 7 = 31,
  # and 31 + 8 real-process + 8 non-tests targets (2 tui-ui scripts, 2 `-m
  # ui.*`, `examples/drive_vim.py`, and `_sandbox_posix_backend.py`, which CI
  # runs but build_suite omits) accounts for the inventory.
  #
  # These 24 are in-process only: AST-checked for zero spawn/fork/Popen/
  # subprocess calls, and each constructs PtySession/WinptyBackend against an
  # INJECTED fake transport rather than a real child (or, for the daemon
  # control-plane gates, drives the real accept loop against a fake session).
  # They are not the PTY probes. That is why this job can be
  # unbounded-by-matrix and still cheap — but the bound is set anyway (the
  # 360-min default is unacceptable), and the steps stay serial within the
  # runner. 15 minutes still covers the added six: they measure 0.12-1.19 s
  # each (~3 s total) against a job that already installs a full dependency
  # set, so the binding cost is the install, not the gates.
  #
  # Deliberately NOT `python tests/run_all.py`, and the corollary is the whole
  # point of the six steps added above: that aggregator also runs the
  # real-process probes and the real-tmux differential suites, which spawn live
  # PTY sessions and must stay one-at-a-time — the red line at the top of
  # CLAUDE.md. Running it here would trade the repo's concurrency rule for a
  # wider gate. It is invoked by no workflow on purpose, which means
  # membership in build_suite() is DOCUMENTATION, NOT A GATE: six pure-memory
  # gates were registered there and stayed unwired until this job named them.
  # A new gate is ungated until a `run:` step or DETERMINISTIC_TESTS says so.
  #
  # One OS, not the matrix: these gates are pure in-memory/fake-transport logic,
  # so a second OS buys no new signal and 6x the runner minutes. The matrix
  # `tests` job above is where OS coverage belongs.
  deterministic-rest:
    name: remaining deterministic gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      # Fail closed. `set -e` is GitHub's default shell behaviour, and each
      # `python tests/<g>.py` exits non-zero on failure, so the first red gate
      # fails the step and the job. No `|| true`, no `continue-on-error`: a gate
      # that cannot turn red is not a gate.
      - name: Daemon concurrency + liveness tail
        run: |
          python -B tests/test_daemon_concurrency.py
          python -B tests/test_liveness_gaps.py
      - name: Prose-only claims are now gates (request bound, registry name)
        run: python -B tests/test_enforced_claims.py
      - name: A04 transport budget / close / backlog
        run: |
          python -B tests/test_a04_read_budget.py
          python -B tests/test_a04_pending_readiness.py
          python -B tests/test_a04_parser_pending.py
          python -B tests/test_a04_daemon_service.py
          python -B tests/test_a04_io_surface.py
          python -B tests/test_a04_close_state.py
          python -B tests/test_a04_winpty_backlog.py
      - name: Cell-span / SGR / partial-write regressions
        run: |
          python -B tests/test_cell_span_regression.py
          python -B tests/test_sgr_stream_regression.py
          python -B tests/test_partial_write_regression.py
          python -B tests/test_partial_write_edges.py
      # Six pure-memory gates that shipped registered-but-unwired: they were in
      # build_suite(), and NO workflow named them. Registering a gate in
      # run_all.py buys nothing — no workflow runs that aggregator — so each
      # one needs its own step here to be a gate at all.
      - name: "Terminal parsing: unknown sequences rejected, closed mode registry"
        run: |
          python -B tests/test_unknown_sequences.py
          python -B tests/test_terminal_modes.py
      - name: "Wait outcomes: revision anchors + child death"
        run: |
          python -B tests/test_revision_baseline.py
          python -B tests/test_child_death_wait.py
      - name: "Graphics payloads never drawn + JSON Lines session log"
        run: |
          python -B tests/test_graphics_payload.py
          python -B tests/test_session_log.py
