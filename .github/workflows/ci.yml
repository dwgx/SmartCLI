name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Deterministic checks across all three OSes and the supported Python edges.
  # Windows matches the primary dev/target environment (ConPTY via pywinpty);
  # Linux + macOS
  # exercise the stdlib POSIX pty backend that was previously only hand-verified
  # over SSH. The interactive drive-tui PTY probes and the effort_selector path
  # need a live TTY and stay out of this broad matrix. The bounded native
  # drive-smoke job below covers the persistent PTY/MCP path separately.
  tests:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: fx regression (verify_fx)
        run: python tests/verify_fx.py

      # Crown-jewel DETERMINISTIC gates — pure/in-memory, no PTY spawn, so they
      # run reliably on every OS and now gate every PR (previously these
      # mutation-proof / contract / fuzz suites weren't wired into CI at all).
      - name: fx frame contract (30 effects x sizes)
        run: python tests/test_fx_contract.py

      - name: readiness virtual-clock + blank-gate locks
        run: python tests/test_readiness.py

      - name: wait_any multi-marker wait (deterministic)
        run: python tests/test_wait_any.py

      - name: visual-change selection/cursor locks (deterministic)
        run: python tests/test_visual_change.py

      - name: drive control-plane security boundaries (deterministic)
        run: python tests/test_drive_security.py

      - name: ten version sites agree (anti-drift)
        run: python tests/test_version_sync.py

      - name: real-terminal fidelity locks (deterministic)
        run: python tests/test_terminal_fidelity.py

      - name: wait-primitive performance contract (deterministic)
        run: python tests/test_perf_contract.py

      - name: readiness property-based invariants (skips without hypothesis)
        run: |
          python -m pip install --quiet hypothesis
          python tests/test_readiness_properties.py

      - name: sixel wire-format lock (deterministic)
        run: python tests/test_sixel.py

      - name: terminal-bench adapter driver+loop (deterministic)
        run: python tests/test_tbench_adapter.py

      - name: degenerate-input regression locks
        run: python tests/test_degenerate_inputs.py

      - name: pure-memory fuzz sandbox (perception chain)
        run: python tests/_sandbox_fuzz_core.py

      - name: drive-tui vendored core == canonical
        run: python tests/test_vendor_sync.py

      - name: doc counts match code (anti-drift, fx=30 guard)
        run: python tests/test_doc_counts.py

      - name: README literal import-order check
        run: python tests/_readme_literal.py

      - name: tui-ui self test
        working-directory: skills/tui-ui
        run: python self_test.py

      - name: cmd-art effect catalog renders
        working-directory: skills/cmd-art
        run: python -m fx list

      - name: tui-ui widget catalog renders
        working-directory: skills/tui-ui
        run: python -m ui widgets

      # POSIX-only: the stdlib pty.fork() backend + perceive stack + the two
      # recorded POSIX fixes (#5 SS3 arrows, #6 zombie reap). This is the code
      # path that was previously only hand-verified on Debian over SSH; running
      # it on ubuntu + macos keeps it green automatically and finally covers the
      # macOS BSD-pty EOF path.
      - name: POSIX pty backend sandbox
        if: runner.os != 'Windows'
        run: python tests/_sandbox_posix_backend.py

  # Real end-to-end sessions on native ConPTY/BSD PTY/Linux PTY. Each probe
  # owns at most one live child at a time and closes it in a finally block; the
  # steps remain serial within each isolated runner.
  drive-smoke:
    name: drive + MCP smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Persistent CLI end-to-end
        run: python tests/_tui_cli_probe.py
      - name: MCP adapter end-to-end
        run: python tests/_mcp_probe.py
      - name: Malformed transport remains session-local
        run: python tests/_sandbox_daemon_robustness.py

  # The release artifact is a product surface of its own. Build it, inspect its
  # contents, install into a clean environment, and exercise the installed
  # console command so a source-only success cannot hide a broken wheel.
  package:
    name: wheel + registry contract
    runs-on: ubuntu-latest
    # This job runs a real-PTY probe (SMARTCLI_TEST_INSTALLED=1 _mcp_probe) —
    # bound it like drive-smoke so a hung probe cannot eat the 360-min default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tooling
        run: python -m pip install --upgrade pip build twine check-jsonschema uv
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          check-jsonschema --schemafile "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json" server.json
      - name: Verify release metadata and wheel contents
        run: |
          python - <<'PY'
          import json
          import tomllib
          import zipfile
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          plugin = json.loads(Path(".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          version = project["version"]
          assert server["version"] == version
          assert server["packages"][0]["version"] == version
          assert plugin["version"] == version

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "smartcli_core/__init__.py",
              "smartcli_drive/__init__.py",
              "smartcli_drive/tui.py",
              "smartcli_drive/mcp_server.py",
              "smartcli_drive/smartcli_bootstrap.py",
          }
          missing = required - names
          assert not missing, f"wheel is missing: {sorted(missing)}"
          print(f"validated {wheel.name} ({version})")
          PY
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          wheel_venv="$(mktemp -d)/venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install dist/*.whl
          "$wheel_venv/bin/python" -m pip check
          "$wheel_venv/bin/smartcli-tui" doctor
          "$wheel_venv/bin/smartcli-tui" --help
          "$wheel_venv/bin/python" -c "import smartcli_core, smartcli_drive.mcp_server"
          SMARTCLI_TEST_INSTALLED=1 "$wheel_venv/bin/python" tests/_mcp_probe.py
          uvx --from dist/*.whl smartcli-tui doctor

  # Coverage over the DETERMINISTIC subset (no PTY/fuzz — those don't compose
  # with coverage's process-startup hook; see tools/coverage_run.py). One OS is
  # enough — coverage of pure-logic gates is OS-independent. Advisory: it reports
  # a number and uploads to Codecov, it does not gate the build.
  coverage:
    name: coverage (deterministic subset)
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Install the optional extras too: the banner widget's golden frame is
          # the pyfiglet render, so pyfiglet must be present or that gate skips.
          # It also makes coverage exercise the optional-dep code paths.
          python -m pip install ".[all]"
          python -m pip install "coverage[toml]>=7.0"
      - name: Run coverage over the deterministic gates
        run: python tools/coverage_run.py --xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          # Tokenless uploads on a plain push are rate-limited/unsupported now
          # (v4/v5 only allow it for fork PRs), so use the repo upload token.
          # Add it once: Codecov -> the repo -> copy CODECOV_TOKEN, then GitHub
          # repo Settings -> Secrets and variables -> Actions -> new secret
          # named CODECOV_TOKEN. Until it exists this step soft-fails (advisory).
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true
