name: Lint

# Correctness-level Ruff rules and the typed core are blocking. The full style
# and modernization backlog remains advisory until it can be cleaned without a
# repository-wide formatting rewrite.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff mypy

      # mypy MUST see the real pyte, or the gate checks a state that does not
      # exist. pyte ships py.typed; with it absent, ignore_missing_imports
      # degrades pyte.Screen to Any, which both hides real errors in the
      # subclass and reports a correct `type: ignore` as unused (warn_unused_ignores).
      # That failed CI on a passing tree while two genuine errors went unseen.
      - name: Install runtime dependencies (so mypy resolves pyte)
        run: python -m pip install -r requirements.txt

      - name: ruff correctness gate
        run: ruff check --select E9,F63,F7,F82 .

      - name: mypy (smartcli_core)
        run: mypy

      - name: ruff full report (advisory)
        continue-on-error: true
        run: ruff check .

      - name: ruff format report (advisory)
        continue-on-error: true
        run: ruff format --check .

  # The Read the Docs site (https://smartcli.readthedocs.io/) is assembled by
  # tools/build_docs.py and built by mkdocs. Nothing verified that build on a PR,
  # so a broken cross-doc link or a page dropped from the nav could only be found
  # by noticing the live site had rotted. `--strict` turns those into failures.
  # BLOCKING on purpose: the failure mode is silent, so an advisory gate here
  # would just be noise nobody reads.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the docs toolchain
        run: pip install -r docs/requirements.txt
      - name: Assemble docs/*.md from the canonical sources
        run: python tools/build_docs.py
      - name: mkdocs build --strict (fails on broken links / nav drift)
        run: python -m mkdocs build --strict
