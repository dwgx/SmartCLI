name: Lint

# Correctness-level Ruff rules and the typed core are blocking. The full style
# and modernization backlog remains advisory until it can be cleaned without a
# repository-wide formatting rewrite.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff mypy

      - name: ruff correctness gate
        run: ruff check --select E9,F63,F7,F82 .

      - name: mypy (smartcli_core)
        run: mypy

      - name: ruff full report (advisory)
        continue-on-error: true
        run: ruff check .

      - name: ruff format report (advisory)
        continue-on-error: true
        run: ruff format --check .
