# Publish smartcli-toolkit to PyPI via Trusted Publishing (OIDC).
#
# ---------------------------------------------------------------------------
# ONE-TIME MANUAL SETUP (a human must do this ONCE, before the first tag push):
#
# This workflow uses PyPI Trusted Publishing (OpenID Connect). There is NO API
# token and NO password anywhere — GitHub mints a short-lived OIDC identity and
# PyPI verifies it against a Trusted Publisher you register. That is what fixes
# the token-leak risk: there is no long-lived secret to leak.
#
# Register the Trusted Publisher on PyPI:
#   1. Sign in to PyPI as an owner of the project.
#   2. Go to:
#        https://pypi.org/manage/project/smartcli-toolkit/settings/publishing/
#   3. Under "Add a new publisher" -> "GitHub", enter EXACTLY:
#        PyPI Project Name: smartcli-toolkit
#        Owner:             dwgx
#        Repository name:   SmartCLI
#        Workflow name:     publish.yml
#        Environment name:  pypi
#   4. Save.
#
# Also create the GitHub environment named `pypi` (repo Settings -> Environments)
# so the `environment: pypi` reference below resolves. It needs no secrets; you
# may optionally add required reviewers to gate releases.
#
# After setup, releasing is: bump the version in pyproject.toml, commit, then
#   git tag v0.2.0 && git push origin v0.2.0
# The tag push triggers this workflow, which builds and publishes automatically.
#
# `workflow_dispatch` exists to RE-RUN a release (a half-finished publish, a
# repaired index) without pushing a new tag. It is not a way around the gates:
# a dispatch must name the version tag it is re-running, and then it clears
# exactly the same checks a tag push does. Dispatching a branch is refused by the
# first step of the `verify` job, so there is no path from this workflow to
# production PyPI that has not been checked against a tag.
# ---------------------------------------------------------------------------

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Fail-closed release gate, ahead of the build.
  #
  # ci.yml runs on `push: branches: ["**"]` and on `pull_request`; a tag ref
  # matches NEITHER. So a tag pushed from a side branch, a detached commit or a
  # revert reaches this workflow with an all-green board and no test ever
  # executed — and branch protection does not extend to tag refs.
  #
  # Rather than re-run the suite here, assert ancestry. ci.yml already ran on
  # every commit that main took, so `git merge-base --is-ancestor <tagged
  # commit> origin/main` is precisely the claim "this exact commit has passed
  # CI": the tag is a promotion of an already-tested commit, and the release
  # path stays fast.
  #
  # The tag/version/metadata agreement assertion — which used to live in, and
  # only run in, `publish-mcp`, i.e. AFTER PyPI had already been published to —
  # is stated HERE, once, before anything is built or published, so a mismatch
  # can no longer half-publish.
  #
  # BOTH of these run on BOTH trigger paths, and the way that is achieved is
  # that there is only one path: a workflow_dispatch must name a `v*` tag, so
  # the ancestry and version-agreement steps below — which used to carry
  # `if: github.event_name == 'push'` and were therefore SKIPPED on dispatch
  # while `publish` went on to reach production PyPI — have a tag to work from
  # on either trigger. The ancestry half is genuinely unanswerable without a
  # tag; requiring one is how that is closed rather than documented around.
  #
  # Deliberately no `environment: pypi` and no `id-token: write` here: this job
  # must be able to fail while nothing publishable exists.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify release ref
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. The default shallow fetch
      # (depth 1) carries no parent commits, so `merge-base --is-ancestor` could
      # only ever answer "no" — right answer, wrong reason, no history to walk.
      # A full fetch also populates refs/remotes/origin/*, so origin/main exists
      # to be compared against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refuse any ref that is not a version tag
        # Runs on BOTH paths, and on a push it can only ever pass: the trigger
        # filter is already `tags: v*`. On workflow_dispatch it is the whole
        # gate. `on: workflow_dispatch` hands the workflow whatever ref the
        # person (or the API call) chose, so a dispatch used to build and
        # publish an arbitrary branch: the ancestry and version steps below were
        # both `if: github.event_name == 'push'`, so the verify job's only
        # executing step was an echo, the job went green, and `publish` — which
        # carries `environment: pypi`, `id-token: write` and `skip-existing:
        # true` — still reached production PyPI through the same OIDC Trusted
        # Publisher. Requiring a `v*` ref closes that: the dispatch path is not
        # a reduced-verification path, it is the SAME path, because a tag ref
        # carries everything the gates need.
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$REF_NAME" in
            v[0-9]*)
              echo "::notice::${EVENT_NAME} on ${REF_NAME}: a version tag, so both release gates below run exactly as they do for a push"
              ;;
            *)
              echo "::error::refusing to release from '${REF_NAME}'. A manual dispatch must name the VERSION TAG being released (e.g. --ref v0.2.3), not a branch: ancestry and tag/version agreement are checked against a tag, and without one this workflow has no release to verify. Re-run the failed tag push with 'Re-run failed jobs' instead, or dispatch this workflow with ref=${REF_NAME#v}" >&2
              exit 1
              ;;
          esac

      - name: Verify the tagged commit is already on origin/main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet 'origin/main^{commit}' >/dev/null; then
            echo "::error::origin/main is absent after a full fetch; refusing to guess the protected branch" >&2
            exit 1
          fi
          # fetch-depth: 0 above is load-bearing, not hygiene (no parent commits
          # means merge-base could only ever answer "no"). A dispatch is handed
          # a tag rather than a branch head, so make sure that exact tag is
          # present in this checkout before resolving it.
          git fetch --force --quiet origin "refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"
          if ! commit="$(git rev-parse --verify "refs/tags/${REF_NAME}^{commit}")"; then
            echo "::error::tag ${REF_NAME} does not resolve to a commit in this checkout" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "::error::tag ${REF_NAME} points at ${commit}, which is NOT an ancestor of origin/main. Refusing to release an untested commit: CI never runs on a tag ref and branch protection does not cover tags. Get the commit onto main and let CI go green, then tag." >&2
            exit 1
          fi
          echo "::notice::${REF_NAME} -> ${commit} is an ancestor of origin/main, so ci.yml has already covered it"

      - name: Verify tag version and package metadata agree
        # No `if` here any more. This used to be skipped on the dispatch path,
        # which is why a dispatch could ship a tree whose pyproject.toml,
        # server.json and the registry's own idea of the version had drifted
        # apart. The agreement does not need a tag to be asserted, and now that
        # a dispatch is required to carry one, the tag is there to compare with.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # raise SystemExit with a message rather than a bare `assert`: the
          # message is the diagnosis, and a bare assert is stripped under
          # `python -O`, which would turn a required check into a no-op. Every
          # branch below exits non-zero; nothing is defaulted or tolerated.
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["REF_NAME"]
          tag_version = tag.removeprefix("v")
          package_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          for label, found in (
              ("pyproject.toml [project].version", package_version),
              ("server.json .version", server["version"]),
              ("server.json .packages[0].version", server["packages"][0]["version"]),
          ):
              if found != tag_version:
                  raise SystemExit(
                      f"{label} is {found!r}, but tag {tag} implies {tag_version!r}"
                  )
          print(f"tag {tag} agrees with pyproject.toml and both server.json versions")
          PY

      - name: State what this run did and did not verify
        # A release gate that cannot say what it checked is a gate whose scope
        # has to be guessed at. Printed on both paths: the ancestry assertion
        # rests on ci.yml having run on the commits main took, which is
        # branch protection's job and not this workflow's — the honest limit of
        # a fast gate.
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "::notice::${EVENT_NAME} on ${REF_NAME}: verified (1) the ref is a version tag, (2) it is an ancestor of origin/main, (3) pyproject.toml and both server.json versions agree with it. Not verified here: that ci.yml ran on this exact commit — that is what branch protection on main is for."
  build:
    needs: verify
    name: Build distribution
    runs-on: ubuntu-latest
    # Guard: this workflow publishes to PRODUCTION PyPI. Its trigger `tags: v*`
    # also matches prerelease tags (v0.1.3rc1 / v0.1.3a1 / v0.1.3b2), which the
    # SEPARATE publish-testpypi.yml is meant to handle. GitHub tag patterns are
    # globs, not regex, so we can't exclude prereleases in the `on:` filter —
    # skip them here instead, so a rehearsal tag goes to TestPyPI ONLY and never
    # silently burns a version string on the real index. A workflow_dispatch is
    # now held to the same rule: the verify job refuses any dispatch that is not
    # a `v*` ref, so by the time this job runs a dispatch carries a tag too, and
    # a prerelease tag dispatched by hand is exactly the case that must not
    # reach the real index.
    if: >-
      !contains(github.ref_name, 'rc') &&
      !contains(github.ref_name, 'a') &&
      !contains(github.ref_name, 'b')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing / OIDC)
    needs: build
    runs-on: ubuntu-latest
    # `id-token: write` is REQUIRED so GitHub can mint the OIDC token that PyPI
    # verifies against the registered Trusted Publisher. No other secret is used.
    permissions:
      id-token: write
    environment: pypi
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # No username/password/token: authentication is handled entirely by OIDC
        # Trusted Publishing (see the one-time setup comment at the top).
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Skip files already on PyPI instead of erroring. This makes a
          # workflow_dispatch re-run on an already-published version succeed
          # (it verifies the OIDC handshake without failing on duplicate files),
          # and is harmless for a real release (a new version's files don't exist
          # yet, so nothing is skipped).
          skip-existing: true

  publish-mcp:
    name: Publish metadata to MCP Registry (GitHub OIDC)
    needs: publish
    # No `if` here any more, and the reason is the same as everywhere else in
    # this file: a dispatch now carries a version tag and clears the identical
    # gates, so restricting this job to pushes would leave a dispatched release
    # published to PyPI and missing from the registry — a half-release the
    # `needs: publish` chain is supposed to make impossible.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The tag/pyproject/server.json agreement used to be asserted HERE — after
      # PyPI had already been published to, so a mismatch could half-publish.
      # It is now stated once, in the `verify` job, which gates `build`; this
      # job transitively inherits that gate through build -> publish, and runs
      # on the same ref. Re-checking it here would only be a second copy to
      # drift.
      - name: Install pinned MCP publisher
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 --output "$archive" "$base/$archive"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 --output checksums.txt "$base/registry_1.8.0_checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher

      - name: Wait until the PyPI release is visible
        run: |
          python - <<'PY'
          import json
          import time
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          url = "https://pypi.org/pypi/smartcli-toolkit/json"
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      releases = json.load(response)["releases"]
                  if version in releases and releases[version]:
                      print(f"PyPI {version} is visible")
                      break
              except (OSError, urllib.error.URLError, ValueError):
                  pass
              if attempt == 23:
                  raise SystemExit(f"PyPI {version} was not visible after 2 minutes")
              time.sleep(5)
          PY

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        # Idempotent on purpose, like the PyPI step above (`skip-existing: true`).
        # A tag re-point or a workflow re-run after the version is already in the
        # registry returns 400 "cannot publish duplicate version"; that is the
        # desired end state, not a failure. Every other error still fails the job.
        run: |
          set -o pipefail
          log="$(mktemp)"
          if ./mcp-publisher publish 2>&1 | tee "$log"; then
            exit 0
          fi
          if grep -q "cannot publish duplicate version" "$log"; then
            echo "::notice::server metadata for this version is already published; nothing to do"
            exit 0
          fi
          exit 1
